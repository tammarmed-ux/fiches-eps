<style id="axCss">
.ax-root,.ax-root *,.ax-mod,.ax-mod *{box-sizing:border-box}
.ax-root,.ax-mod{--nv:#0A3768;--nv2:#123f7a;--ind:#3b4cca;--or:#E75C04;--bg:#F3F6FA;--ln:#dbe3ee;--g:#5b6779;--ok:#0f766e;--rd:#c0392b}
.ax-root{ min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center;padding:24px 14px;font-family:"Segoe UI",Calibri,Roboto,"Helvetica Neue",Arial,sans-serif;color:#1c2733;
 background:radial-gradient(1200px 600px at 10% -10%,#1e4f93 0,transparent 60%),linear-gradient(160deg,#0A3768 0,#1b2f74 55%,#2b3a9b 100%)}
body.ax-body{margin:0}
.ax-card{width:100%;max-width:460px;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(5,20,50,.35);overflow:hidden}
.ax-head{padding:22px 24px 14px;display:flex;gap:12px;align-items:center;border-bottom:1px solid #eef2f7}
.ax-logo{width:44px;height:44px;border-radius:12px;background:var(--nv);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;letter-spacing:.5px;flex:none}

.ax-tabs{display:flex;gap:4px;padding:10px 12px 0;background:#f7f9fc;border-bottom:1px solid #eef2f7}
.ax-tab{flex:1;border:0;background:none;padding:10px 6px 11px;font:600 13.5px inherit;font-family:inherit;color:var(--g);border-bottom:3px solid transparent;cursor:pointer;border-radius:8px 8px 0 0}
.ax-tab.on{color:var(--nv);border-bottom-color:var(--or);background:#fff}

.ax-f label{font-size:12.5px;font-weight:600;color:#334155}
.ax-f input,.ax-f select{font:15px inherit;font-family:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;background:#fff;color:#1c2733;width:100%}
.ax-f input:focus,.ax-f select:focus{outline:2px solid #c7d2fe;border-color:var(--ind)}
.ax-row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ax-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:10px;padding:11px 16px;font:600 14.5px inherit;font-family:inherit;cursor:pointer;background:var(--nv);color:#fff;width:100%}
.ax-btn:hover{background:var(--nv2)}
.ax-btn.or{background:var(--or)}.ax-btn.or:hover{background:#cf5203}
.ax-btn.gh{background:#fff;color:var(--nv);border:1px solid var(--ln)}.ax-btn.gh:hover{background:#f1f5fb}
.ax-btn:disabled{opacity:.6;cursor:wait}
.ax-link{background:none;border:0;color:var(--ind);font:13px inherit;font-family:inherit;cursor:pointer;padding:0;text-decoration:underline}
.ax-msg{border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px;line-height:1.45}
.ax-msg.e{background:#fdecea;color:#8a1f12}.ax-msg.o{background:#e7f6f3;color:#0b5b52}.ax-msg.i{background:#eef2ff;color:#2a3593}
.ax-chk{font-size:12.5px;margin-top:2px;min-height:16px}

.ax-stack{display:flex;flex-direction:column;gap:8px}
.ax-spin{width:34px;height:34px;border:4px solid #dbe3ee;border-top-color:var(--or);border-radius:50%;margin:10px auto 14px;animation:axs 0.9s linear infinite}
@keyframes axs{to{transform:rotate(360deg)}}
.ax-hint{font-size:12px;color:#64748b;margin:-4px 0 12px}
@media (max-width:480px){.ax-row2{grid-template-columns:1fr}.ax-body2{padding:16px 16px 18px}.ax-head{padding:18px 16px 12px}.ax-tab{font-size:12.5px;padding:9px 3px 10px}}

.ax-mod{position:fixed;inset:0;z-index:1000;background:rgba(8,20,45,.55);display:flex;justify-content:flex-end;font-family:"Segoe UI",Calibri,Roboto,"Helvetica Neue",Arial,sans-serif;color:#1c2733}
.ax-mod[hidden]{display:none}
.ax-drawer{width:min(760px,100%);height:100%;background:#F3F6FA;display:flex;flex-direction:column;box-shadow:-10px 0 40px rgba(0,0,0,.25)}
.ax-dh{background:#0A3768;color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px}

.ax-dt{display:flex;gap:4px;padding:8px 12px 0;background:#fff;border-bottom:1px solid #dbe3ee;overflow-x:auto}
.ax-dt button{border:0;background:none;padding:10px 12px;font:600 14px inherit;font-family:inherit;color:#5b6779;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.ax-dt button.on{color:#0A3768;border-bottom-color:#E75C04}
.ax-dc{flex:1;overflow:auto;padding:16px 18px 30px}
.ax-box{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:14px 16px;margin-bottom:14px}
.ax-box h3{margin:0 0 10px;font-size:15px;color:#0A3768}
.ax-g4{display:grid;grid-template-columns:2fr 1fr 1fr 1.3fr;gap:10px;align-items:end}
@media (max-width:640px){.ax-g4{grid-template-columns:1fr 1fr}.ax-g4 .ax-f:first-child{grid-column:1/-1}}
.ax-it{background:#fff;border:1px solid #dbe3ee;border-radius:12px;padding:11px 13px;margin-bottom:9px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ax-it .m{flex:1 1 240px;min-width:0}
.ax-it .n{font-weight:700;color:#0A3768;font-size:14.5px;overflow-wrap:anywhere}
.ax-it .s{font-size:12.5px;color:#5b6779;margin-top:2px;overflow-wrap:anywhere}
.ax-code{font-family:ui-monospace,Consolas,monospace;background:#eef2ff;color:#2a3593;border-radius:6px;padding:1px 6px;font-size:12.5px}
.ax-acts{display:flex;gap:6px;flex-wrap:wrap}
.ax-sb{border:1px solid #dbe3ee;background:#fff;color:#0A3768;border-radius:8px;padding:7px 10px;font:600 12.5px inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.ax-sb:hover{background:#f1f5fb}
.ax-sb.ok{background:#0f766e;border-color:#0f766e;color:#fff}.ax-sb.rd{background:#fff;border-color:#f3c3bd;color:#b42318}.ax-sb.rd:hover{background:#fdecea}
.ax-pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:700}
.ax-pill.active{background:#e7f6f3;color:#0b5b52}.ax-pill.pending{background:#fff4e5;color:#9a4a00}.ax-pill.revoked{background:#fdecea;color:#8a1f12}.ax-pill.mod{background:#eef2ff;color:#2a3593}.ax-pill.off{background:#eef1f5;color:#5b6779}
.ax-empty{color:#64748b;font-size:14px;text-align:center;padding:24px 10px}
.ax-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#0A3768;color:#fff;padding:10px 16px;border-radius:10px;z-index:1100;font:600 13.5px "Segoe UI",Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25)}

<body class="ax-body">
<div class="ax-root" id="axRoot"><div class="ax-card"><div class="ax-body2 ax-center"><div class="ax-spin"></div><p>Chargement…</p></div></div></div>
<noscript><p style="padding:20px;font-family:sans-serif">Activez JavaScript pour utiliser Fiches EPS.</p></noscript>
<script>
(function(){
"use strict";
const SB_URL="https://fndoeuhgrmsarsnxaskj.supabase.co", SB_KEY="sb_publishable_zV1cm7R1v67SmtoNiXZUmQ_4EjHrasB";
const SITE="https://tammarmed-ux.github.io/fiches-eps/", MOD_EMAIL="tammar.med@gmail.com";
const root=document.getElementById("axRoot");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=(s,r)=>(r||document).querySelector(s), $$=(s,r)=>[...(r||document).querySelectorAll(s)];
function toast(t){const d=document.createElement("div");d.className="ax-toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)}
if(!window.supabase||!window.supabase.createClient){root.innerHTML=card(`<div class="ax-body2 ax-center"><div class="ax-ico">⚠️</div><h2>Connexion impossible</h2><p>Le service d’authentification n’a pas pu être chargé. Vérifiez votre connexion Internet puis rechargez la page.</p><button class="ax-btn" onclick="location.reload()">Recharger</button></div>`);return}
const sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
window.__axSb=sb;
const params=new URLSearchParams(location.search), INVITE=(params.get("invite")||"").trim().toUpperCase();
let PROFILE=null, APP_LOADED=false, RECOVERY=false;

function card(inner,head){return `<div class="ax-card">${head===false?"":`<div class="ax-head"><div class="ax-logo">E<b>P</b>S</div><div><h1>Fiches EPS</h1><p>Préparation de séances d’EPS · accès réservé</p></div></div>`}${inner}<div class="ax-foot">Powered by TATABO3 · accès sur invitation</div></div>`}
const ERR={"Invalid login credentials":"E-mail ou mot de passe incorrect.","Email not confirmed":"Votre adresse e-mail n’est pas encore confirmée : cliquez sur le lien reçu par e-mail.",email:"Adresse e-mail invalide.",password:"Le mot de passe doit contenir au moins 8 caractères.",full_name:"Indiquez votre nom complet.",exists:"Un compte existe déjà avec cette adresse : utilisez l’onglet « Connexion ».",rate:"Trop de demandes pour le moment, réessayez dans une heure.",invite:"Code d’invitation invalide.",create:"Création du compte impossible. Réessayez.",network:"Problème de connexion. Vérifiez Internet et réessayez."};
const REASON={not_found:"Code inconnu.",revoked:"Ce code a été révoqué.",expired:"Ce code a expiré.",used:"Ce code a déjà été utilisé le nombre maximal de fois.",empty:"",invalid:"Code invalide."};
const errTxt=e=>ERR[e]||ERR[(e&&e.message)||""]||(e&&e.message)||String(e||"Erreur");

/* ---------- écran d'accès ---------- */
function showAuth(tab,msg){
 tab=tab||(INVITE?"inv":"login");
 const T=[["login","Connexion"],["inv","J’ai une invitation"],["req","Demander un accès"]];
 root.innerHTML=card(`<div class="ax-tabs" role="tablist">${T.map(([k,l])=>`<button class="ax-tab${k===tab?" on":""}" role="tab" aria-selected="${k===tab}" data-t="${k}">${l}</button>`).join("")}</div><div class="ax-body2" id="axPane"></div>`);
 $$(".ax-tab",root).forEach(b=>b.onclick=()=>showAuth(b.dataset.t));
 const P=$("#axPane",root);
 const M=msg?`<div class="ax-msg ${msg[0]}">${msg[1]}</div>`:"";
 const who=`<div class="ax-f"><label for="axName">Nom complet</label><input id="axName" autocomplete="name" required maxlength="120" placeholder="Prénom Nom"></div>
  <div class="ax-f"><label for="axEtab">Établissement</label><input id="axEtab" autocomplete="organization" maxlength="160" placeholder="Lycée / collège"></div>
  <div class="ax-f"><label for="axEmail">E-mail</label><input id="axEmail" type="email" autocomplete="email" required></div>
  <div class="ax-f"><label for="axPw">Mot de passe (8 caractères minimum)</label><input id="axPw" type="password" autocomplete="new-password" minlength="8" required></div>`;
 if(tab==="login"){
  P.innerHTML=`${M}<form id="axForm" novalidate><div class="ax-f"><label for="axEmail">E-mail</label><input id="axEmail" type="email" autocomplete="email" required></div>
   <div class="ax-f"><label for="axPw">Mot de passe</label><input id="axPw" type="password" autocomplete="current-password" required></div>
   <div id="axErr"></div><button class="ax-btn" id="axGo">Se connecter</button></form>
   <p style="margin:12px 0 0;text-align:center"><button class="ax-link" id="axForgot">Mot de passe oublié ?</button></p>`;
  $("#axForm").onsubmit=async e=>{e.preventDefault();const b=$("#axGo");b.disabled=true;$("#axErr").innerHTML="";
   const {error}=await sb.auth.signInWithPassword({email:$("#axEmail").value.trim(),password:$("#axPw").value}).catch(e=>({error:{message:"network"}}));
   b.disabled=false;if(error){$("#axErr").innerHTML=`<div class="ax-msg e">${esc(errTxt(error))}</div>`;return}route()};
  $("#axForgot").onclick=()=>showForgot();
 }else if(tab==="inv"){
  P.innerHTML=`${M}<form id="axForm" novalidate><div class="ax-f"><label for="axCode">Code d’invitation</label><input id="axCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="32" value="${esc(INVITE)}" placeholder="EPS-XXXX-XXXX"><div class="ax-chk" id="axChk"></div></div>${who}<div id="axErr"></div><button class="ax-btn or" id="axGo">Créer mon compte</button></form>`;
  let tm=0,last="";const chk=async()=>{const c=$("#axCode").value.trim().toUpperCase();if(c===last)return;last=c;const o=$("#axChk");if(!c){o.textContent="";o.className="ax-chk";return}
   o.textContent="Vérification…";o.className="ax-chk";const {data,error}=await sb.rpc("check_invitation",{p_code:c});if(c!==last)return;
   if(error){o.textContent="Vérification impossible.";o.className="ax-chk ko";return}
   if(data.valid){o.textContent=`✓ Invitation valide${data.label?` — ${data.label}`:""} · ${data.auto_approve?"accès immédiat":"accès après validation par le modérateur"}`;o.className="ax-chk ok"}else{o.textContent="✗ "+(REASON[data.reason]||"Code invalide.");o.className="ax-chk ko"}};
  $("#axCode").oninput=()=>{clearTimeout(tm);tm=setTimeout(chk,350)};if(INVITE)chk();
  $("#axForm").onsubmit=e=>{e.preventDefault();doSignup($("#axCode").value.trim().toUpperCase())};
 }else{
  P.innerHTML=`${M}<p class="ax-hint">Votre demande sera examinée par le modérateur (Mohamed Tammar). Vous pourrez vous connecter dès qu’elle sera acceptée.</p><form id="axForm" novalidate>${who}<div id="axErr"></div><button class="ax-btn" id="axGo">Envoyer la demande</button></form>`;
  $("#axForm").onsubmit=e=>{e.preventDefault();doSignup("")};
 }
}
async function doSignup(code){
 const b=$("#axGo"),E=$("#axErr");E.innerHTML="";
 const v={email:$("#axEmail").value.trim().toLowerCase(),password:$("#axPw").value,full_name:$("#axName").value.trim(),etablissement:$("#axEtab").value.trim(),invite_code:code||undefined};
 if($("#axCode")&&!code){E.innerHTML=`<div class="ax-msg e">Saisissez votre code d’invitation.</div>`;return}
 if(v.full_name.length<2){E.innerHTML=`<div class="ax-msg e">${ERR.full_name}</div>`;return}
 if(v.password.length<8){E.innerHTML=`<div class="ax-msg e">${ERR.password}</div>`;return}
 b.disabled=true;
 try{
  if(v.email===MOD_EMAIL){ // compte modérateur : inscription avec e-mail de confirmation
   const {data,error}=await sb.auth.signUp({email:v.email,password:v.password,options:{emailRedirectTo:SITE,data:{full_name:v.full_name,etablissement:v.etablissement}}});
   b.disabled=false;if(error){E.innerHTML=`<div class="ax-msg e">${esc(errTxt(error))}</div>`;return}
   if(data.session){route();return}
   showAuth("login",["i",`📧 Un e-mail de confirmation a été envoyé à <b>${esc(v.email)}</b>. Cliquez sur le lien qu’il contient, puis revenez ici et connectez-vous.`]);return}
  const r=await fetch(SB_URL+"/functions/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY},body:JSON.stringify(v)});
  const j=await r.json().catch(()=>({error:"create"}));
  if(!r.ok){b.disabled=false;E.innerHTML=`<div class="ax-msg e">${esc(j.error==="invite"?(REASON[j.reason]||ERR.invite):errTxt(j.error))}</div>`;return}
  const {error}=await sb.auth.signInWithPassword({email:v.email,password:v.password});b.disabled=false;
  if(error){showAuth("login",["o","Compte créé. Connectez-vous avec votre e-mail et votre mot de passe."]);return}
  if(code&&history.replaceState)history.replaceState(null,"",location.pathname);
  route();
 }catch(e){b.disabled=false;E.innerHTML=`<div class="ax-msg e">${ERR.network}</div>`}
}
function showForgot(){
 root.innerHTML=card(`<div class="ax-body2"><h2 style="margin:0 0 6px;color:#0A3768;font-size:18px">Mot de passe oublié</h2><p class="ax-hint" style="margin:0 0 12px">Saisissez votre e-mail. Si vous ne recevez rien, demandez à Mohamed (modérateur) de vous attribuer un nouveau mot de passe.</p>
  <form id="axForm"><div class="ax-f"><label for="axEmail">E-mail</label><input id="axEmail" type="email" autocomplete="email" required></div><div id="axErr"></div><div class="ax-stack"><button class="ax-btn" id="axGo">Envoyer le lien</button><button type="button" class="ax-btn gh" id="axBack">Retour</button></div></form></div>`);
 $("#axBack").onclick=()=>showAuth("login");
 $("#axForm").onsubmit=async e=>{e.preventDefault();$("#axGo").disabled=true;const {error}=await sb.auth.resetPasswordForEmail($("#axEmail").value.trim(),{redirectTo:SITE});
  showAuth("login",error?["e",esc(errTxt(error))]:["o","Si un compte existe pour cette adresse, un e-mail de réinitialisation vient d’être envoyé."])};
}
function showNewPassword(){
 root.innerHTML=card(`<div class="ax-body2"><h2 style="margin:0 0 10px;color:#0A3768;font-size:18px">Nouveau mot de passe</h2><form id="axForm"><div class="ax-f"><label for="axPw">Nouveau mot de passe (8 caractères minimum)</label><input id="axPw" type="password" autocomplete="new-password" minlength="8" required></div><div id="axErr"></div><button class="ax-btn" id="axGo">Enregistrer</button></form></div>`);
 $("#axForm").onsubmit=async e=>{e.preventDefault();const pw=$("#axPw").value;if(pw.length<8){$("#axErr").innerHTML=`<div class="ax-msg e">${ERR.password}</div>`;return}
  const {error}=await sb.auth.updateUser({password:pw});if(error){$("#axErr").innerHTML=`<div class="ax-msg e">${esc(errTxt(error))}</div>`;return}RECOVERY=false;toast("Mot de passe modifié");route()};
}
function showState(kind){
 const p=PROFILE||{};
 const html=kind==="pending"?`<div class="ax-body2 ax-center"><div class="ax-ico">⏳</div><h2>Demande en attente de validation</h2><p>Bonjour ${esc(p.full_name||p.email)}, votre compte a bien été créé. Le modérateur (Mohamed Tammar) doit maintenant valider votre accès à Fiches EPS.</p><p style="font-size:13px;color:#64748b">Compte : ${esc(p.email)}${p.etablissement?` · ${esc(p.etablissement)}`:""}</p><div class="ax-stack"><button class="ax-btn" id="axRef">↻ Actualiser le statut</button><button class="ax-btn gh" id="axOut">Se déconnecter</button></div></div>`
 :kind==="revoked"?`<div class="ax-body2 ax-center"><div class="ax-ico">⛔</div><h2>Accès suspendu</h2><p>L’accès de ce compte (${esc(p.email)}) à Fiches EPS a été suspendu par le modérateur. Contactez Mohamed Tammar si vous pensez qu’il s’agit d’une erreur.</p><div class="ax-stack"><button class="ax-btn gh" id="axOut">Se déconnecter</button></div></div>`
 :`<div class="ax-body2 ax-center"><div class="ax-ico">⚠️</div><h2>Profil introuvable</h2><p>Votre compte n’a pas de profil Fiches EPS. Contactez le modérateur.</p><div class="ax-stack"><button class="ax-btn gh" id="axOut">Se déconnecter</button></div></div>`;
 root.innerHTML=card(html);
 const r=$("#axRef");if(r)r.onclick=async()=>{r.disabled=true;r.textContent="Vérification…";await route();};
 $("#axOut").onclick=logout;
}
function showLoading(t){root.innerHTML=card(`<div class="ax-body2 ax-center"><div class="ax-spin"></div><p>${esc(t||"Chargement de Fiches EPS…")}</p></div>`)}
async function logout(){try{await sb.auth.signOut()}catch(e){}location.replace(location.pathname)}

/* ---------- routage ---------- */
let ROUTING=null;
async function route(){if(ROUTING)return ROUTING;ROUTING=(async()=>{try{
 if(APP_LOADED)return;
 if(RECOVERY){showNewPassword();return}
 const {data:{session}}=await sb.auth.getSession();
 if(!session){showAuth();return}
 const {data:p,error}=await sb.from("profiles").select("id,email,full_name,etablissement,role,status").eq("id",session.user.id).maybeSingle();
 if(error){showAuth("login",["e",ERR.network]);return}
 PROFILE=p;if(!p){showState("none");return}
 if(p.status==="pending"){showState("pending");return}
 if(p.status!=="active"){showState("revoked");return}
 await loadApp();
}finally{ROUTING=null}})();return ROUTING}

async function loadApp(){
 showLoading();
 const {data,error}=await sb.from("app_releases").select("version,css,body_html,js").eq("id","current").maybeSingle();
 if(error||!data){root.innerHTML=card(`<div class="ax-body2 ax-center"><div class="ax-ico">⚠️</div><h2>Application indisponible</h2><p>${error?"Problème de connexion.":"Aucune version publiée pour le moment."} Réessayez dans un instant.</p><div class="ax-stack"><button class="ax-btn" onclick="location.reload()">Recharger</button><button class="ax-btn gh" id="axOut">Se déconnecter</button></div></div>`);$("#axOut").onclick=logout;return}
 sb.from("profiles").update({last_seen_at:new Date().toISOString()}).eq("id",PROFILE.id).then(()=>{});
 APP_LOADED=true;
 document.title="Fiches EPS – Préparation de séance";
 const st=document.createElement("style");st.id="appCss";st.textContent=data.css;document.head.appendChild(st);
 document.body.className="";document.body.innerHTML=data.body_html;
 window.__APP_VERSION=data.version;
 const s=document.createElement("script");s.textContent=data.js+"\n//# sourceURL=fiches-eps-app.js";document.body.appendChild(s);
 mountUserBar();
}

/* ---------- barre utilisateur + modérateur ---------- */
function mountUserBar(){
 const top=$("header.top");if(!top)return;const p=PROFILE;
 const w=document.createElement("div");w.className="ax-user";w.id="axUser";
 w.innerHTML=`<span class="ax-who" title="${esc(p.email)}">${esc(p.full_name||p.email)}${p.role==="moderator"?" · modérateur":""}</span>${p.role==="moderator"?`<button class="ax-ub mod" id="axModBtn" title="Panneau modérateur">🛡️ <span class="t">Modérateur</span><span class="ax-badge" id="axModBadge" hidden>0</span></button>`:""}<button class="ax-ub" id="axLogout" title="Se déconnecter (${esc(p.email)})">⎋ <span class="t">Déconnexion</span></button>`;
 top.appendChild(w);
 $("#axLogout").onclick=logout;
 if(p.role==="moderator"){$("#axModBtn").onclick=()=>openMod();refreshBadge();setInterval(refreshBadge,60000)}
}
async function refreshBadge(){const {count}=await sb.from("profiles").select("id",{count:"exact",head:true}).eq("status","pending");const b=$("#axModBadge");if(!b)return;b.hidden=!count;b.textContent=count>99?"99+":String(count||0);const t=$("#axTabPend");if(t)t.textContent=`Demandes en attente${count?` (${count})`:""}`}

let MOD_TAB="inv";
function openMod(tab){
 let m=$("#axMod");
 if(!m){m=document.createElement("div");m.className="ax-mod";m.id="axMod";m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");m.setAttribute("aria-label","Panneau modérateur");
  m.innerHTML=`<div class="ax-drawer"><div class="ax-dh"><span style="font-size:20px">🛡️</span><h2>Panneau modérateur</h2><button class="ax-x" id="axModX" aria-label="Fermer">✕</button></div>
   <div class="ax-dt"><button data-mt="inv">Invitations</button><button data-mt="pend" id="axTabPend">Demandes en attente</button><button data-mt="mem">Membres</button></div><div class="ax-dc" id="axModC"></div></div>`;
  document.body.appendChild(m);
  m.addEventListener("click",e=>{if(e.target===m)closeMod()});$("#axModX").onclick=closeMod;
  $$(".ax-dt button",m).forEach(b=>b.onclick=()=>{MOD_TAB=b.dataset.mt;renderMod()});
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!m.hidden)closeMod()});
 }
 if(tab)MOD_TAB=tab;m.hidden=false;renderMod();refreshBadge();
}
function closeMod(){const m=$("#axMod");if(m)m.hidden=true;refreshBadge()}
const fmtD=d=>d?new Date(d).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}):"—";
const inviteLink=c=>SITE+"?invite="+encodeURIComponent(c);
function genCode(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",u=new Uint32Array(8);crypto.getRandomValues(u);const s=[...u].map(x=>A[x%A.length]).join("");return "EPS-"+s.slice(0,4)+"-"+s.slice(4)}
async function copy(t,ok){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(_){}a.remove()}toast(ok||"Copié")}
async function renderMod(){
 const C=$("#axModC");$$(".ax-dt button").forEach(b=>b.classList.toggle("on",b.dataset.mt===MOD_TAB));
 C.innerHTML=`<div class="ax-empty">Chargement…</div>`;
 if(MOD_TAB==="inv"){
  const {data,error}=await sb.from("invitations").select("id,code,label,max_uses,uses_count,auto_approve,expires_at,is_revoked,created_at").order("created_at",{ascending:false});
  if(MOD_TAB!=="inv")return;
  const now=Date.now(),st=i=>i.is_revoked?["revoked","Révoquée"]:(i.expires_at&&new Date(i.expires_at)<=now)?["off","Expirée"]:i.uses_count>=i.max_uses?["off","Épuisée"]:["active","Active"];
  C.innerHTML=`<div class="ax-box"><h3>Nouvelle invitation</h3><form id="axInvF"><div class="ax-g4">
    <div class="ax-f" style="margin:0"><label for="axIL">Libellé / nom du collègue</label><input id="axIL" maxlength="80" placeholder="ex. M. Alaoui – Lycée Ibn Sina"></div>
    <div class="ax-f" style="margin:0"><label for="axIM">Utilisations max</label><select id="axIM"><option>1</option><option>5</option><option>10</option><option>50</option></select></div>
    <div class="ax-f" style="margin:0"><label for="axIE">Expiration</label><select id="axIE"><option value="7">7 jours</option><option value="30" selected>30 jours</option><option value="0">Jamais</option></select></div>
    <div class="ax-f" style="margin:0"><label for="axIA">Validation</label><select id="axIA"><option value="1">Accès immédiat</option><option value="0">Validation manuelle</option></select></div>
   </div><button class="ax-btn or" style="margin-top:12px;width:auto" id="axInvGo">＋ Créer l’invitation</button></form></div>
   <div id="axInvL">${error?`<div class="ax-msg e">${esc(error.message)}</div>`:!data.length?`<div class="ax-empty">Aucune invitation pour le moment.</div>`:data.map(i=>{const [k,l]=st(i);return `<div class="ax-it" data-id="${i.id}"><div class="m"><div class="n">${esc(i.label||"Invitation")} <span class="ax-pill ${k}">${l}</span></div>
     <div class="s"><span class="ax-code">${esc(i.code)}</span> · utilisations <b data-uses>${i.uses_count}/${i.max_uses}</b> · ${i.auto_approve?"accès immédiat":"validation manuelle"} · ${i.expires_at?"expire le "+fmtD(i.expires_at):"sans expiration"}</div></div>
     <div class="ax-acts"><button class="ax-sb" data-a="link" data-c="${esc(i.code)}">🔗 Copier le lien</button><button class="ax-sb" data-a="code" data-c="${esc(i.code)}">Copier le code</button>${i.is_revoked?"":`<button class="ax-sb rd" data-a="rev">Révoquer</button>`}</div></div>`}).join("")}</div>`;
  $("#axInvF").onsubmit=async e=>{e.preventDefault();const b=$("#axInvGo");b.disabled=true;const d=+$("#axIE").value;
   const row={code:genCode(),label:$("#axIL").value.trim(),max_uses:+$("#axIM").value,auto_approve:$("#axIA").value==="1",expires_at:d?new Date(Date.now()+d*864e5).toISOString():null,created_by:PROFILE.id};
   const {error}=await sb.from("invitations").insert(row);b.disabled=false;if(error){toast("Erreur : "+error.message);return}
   copy(inviteLink(row.code),"Invitation créée — lien copié");renderMod()};
  $$("#axInvL [data-a]").forEach(b=>b.onclick=async()=>{const a=b.dataset.a;if(a==="link")return copy(inviteLink(b.dataset.c),"Lien d’invitation copié");if(a==="code")return copy(b.dataset.c,"Code copié");
   if(a==="rev"){if(!confirm("Révoquer cette invitation ? Le code ne pourra plus être utilisé."))return;const id=b.closest(".ax-it").dataset.id;const {error}=await sb.from("invitations").update({is_revoked:true}).eq("id",id);if(error)toast("Erreur : "+error.message);else{toast("Invitation révoquée");renderMod()}}});
 }else{
  const pend=MOD_TAB==="pend";
  let q=sb.from("profiles").select("id,email,full_name,etablissement,role,status,invitation_code,created_at,last_seen_at").order("created_at",{ascending:false});if(pend)q=q.eq("status","pending");
  const {data,error}=await q;if((MOD_TAB==="pend")!==pend)return;
  const SL={active:"Actif",pending:"En attente",revoked:"Suspendu"};
  C.innerHTML=error?`<div class="ax-msg e">${esc(error.message)}</div>`:!data.length?`<div class="ax-empty">${pend?"Aucune demande en attente. 🎉":"Aucun membre."}</div>`:
   `${pend?"":`<p class="ax-hint" style="margin:0 0 10px">${data.length} comptes · ${data.filter(x=>x.status==="active").length} actifs</p>`}`+data.map(u=>{const self=u.id===PROFILE.id,mod=u.role==="moderator";
    return `<div class="ax-it" data-id="${u.id}"><div class="m"><div class="n">${esc(u.full_name||"(sans nom)")} ${mod?`<span class="ax-pill mod">Modérateur</span>`:""} <span class="ax-pill ${u.status}">${SL[u.status]||u.status}</span></div>
     <div class="s">${esc(u.email)}${u.etablissement?` · ${esc(u.etablissement)}`:""}</div>
     <div class="s">${pend?`Demande du ${fmtD(u.created_at)}`:`Code : ${u.invitation_code?`<span class="ax-code">${esc(u.invitation_code)}</span>`:"—"} · inscrit le ${fmtD(u.created_at)} · dernière connexion : ${fmtD(u.last_seen_at)}`}</div></div>
     <div class="ax-acts">${pend?`<button class="ax-sb ok" data-s="active">✓ Accepter</button><button class="ax-sb rd" data-s="revoked">Refuser</button>`:(self||mod)?"":`${u.status==="active"?`<button class="ax-sb rd" data-s="revoked">Suspendre</button>`:`<button class="ax-sb ok" data-s="active">Réactiver</button>`}<button class="ax-sb" data-pw="1">🔑 Mot de passe</button>`}</div></div>`}).join("");
  $$("#axModC [data-s]").forEach(b=>b.onclick=async()=>{const id=b.closest(".ax-it").dataset.id,s=b.dataset.s;b.disabled=true;
   const {error}=await sb.from("profiles").update({status:s}).eq("id",id);if(error){b.disabled=false;toast("Erreur : "+error.message);return}
   toast(s==="active"?"Accès accordé":"Accès retiré");renderMod();refreshBadge()});
  $$("#axModC [data-pw]").forEach(b=>b.onclick=async()=>{const id=b.closest(".ax-it").dataset.id;const pw=prompt("Nouveau mot de passe provisoire pour ce compte (8 caractères minimum) :");if(!pw)return;if(pw.length<8){toast("8 caractères minimum");return}
   const {data:{session}}=await sb.auth.getSession();const r=await fetch(SB_URL+"/functions/v1/signup",{method:"POST",headers:{"Content-Type":"application/json",apikey:SB_KEY,Authorization:"Bearer "+session.access_token},body:JSON.stringify({action:"set_password",user_id:id,password:pw})});
   toast(r.ok?"Mot de passe modifié — communiquez-le au collègue":"Erreur : mot de passe non modifié")});
 }
}
window.__axOpenMod=openMod;

sb.auth.onAuthStateChange((ev)=>{if(ev==="PASSWORD_RECOVERY"){RECOVERY=true;showNewPassword()}else if(ev==="SIGNED_OUT"&&APP_LOADED)location.replace(location.pathname)});
const hashErr=new URLSearchParams(location.hash.slice(1)).get("error_description");
if(hashErr){showAuth("login",["e",esc(hashErr.replace(/\+/g," "))]);history.replaceState(null,"",location.pathname+location.search)}else route();
})();
</script>
</body>
</html>
